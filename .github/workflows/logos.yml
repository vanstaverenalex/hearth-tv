name: Channel logos

on:
  push:
    branches: [main]
    paths: [channels.json, tools/logos.py, .github/workflows/logos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/logos.py
      - name: Commit logos
        run: |
          git config user.name "Hearth logo bot"
          git config user.email "actions@users.noreply.github.com"
          git add logos
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update channel logos"
          git pull --rebase -q origin main
          git push
