name: Build Hearth TV

on:
  push:
    branches: [main, preview]
    paths-ignore: [backgrounds.json, channels.json, README.md, tools/candidates.txt, tools/candidates.py, tools/logos.py, tools/mono.py, tools/guide_mirror.py, tools/make_loop.sh, logos/**, .github/workflows/backgrounds.yml, .github/workflows/logos.yml, .github/workflows/candidates.yml, .github/workflows/guide.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HearthTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: HearthTV.apk

  # Boots an Android TV emulator (Android 11, like Fire OS 8), opens every screen and
  # screenshots it. A crash fails the build, so a broken app never reaches the TVs.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/smoke.sh HearthTV.apk
      - name: Publish screenshots (release "preview-shots", never marked latest)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview-shots >/dev/null 2>&1 || gh release create preview-shots --title "Emulator screenshots" --latest=false --notes "Screens from the last emulator check."
          gh release view preview-shots --json assets --jq '.assets[].name' | while read -r n; do gh release delete-asset preview-shots "$n" -y; done
          cd shots && echo "${{ github.sha }} run ${{ github.run_id }}" > build.txt
          for f in *; do for t in 1 2 3; do gh release upload preview-shots "$f" --clobber && break; sleep 5; done; done

  release:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hearth TV 1.0.${{ github.run_number }}
          body: |
            Download on your Fire TV with the Downloader app:
            https://github.com/${{ github.repository }}/releases/latest/download/HearthTV.apk
          files: HearthTV.apk
          make_latest: true
