name: Build Hearth TV

on:
  push:
    branches: [main]
    paths-ignore: [backgrounds.json, channels.json, README.md, tools/**, .github/workflows/backgrounds.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HearthTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hearth TV 1.0.${{ github.run_number }}
          body: |
            Download on your Fire TV with the Downloader app:
            https://github.com/${{ github.repository }}/releases/latest/download/HearthTV.apk
          files: HearthTV.apk
          make_latest: true
